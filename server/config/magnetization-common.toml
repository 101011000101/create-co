	# Default: 0.04
	# Range: 0.0 ~ 5.0
	lenzMinSpeed = 0.04
	#Conductor blocks past which Lenz braking sees diminishing returns.
	# Default: 8
	# Range: 1 ~ 4096
	lenzConductorCap = 8
	#Halbach-array boost: aligning same-polarity magnets face-to-face steps an
	#emitter's strength tier up. Set false to disable the boost entirely.
	halbachEnabled = true

