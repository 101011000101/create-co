#Physics tuning for the Sable sub-level query and entity force application.
[physics]
	#Global multiplier applied to every emitter's tier force value.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	strengthMultiplier = 1.0
	#Master switch for Lenz-effect eddy-current ship braking. Set false to
	#disable the effect entirely (skips the per-tick conductor scan too).
	lenzBrakingEnabled = true
	#Lenz-effect eddy-current braking: a magnetic ship moving over conductive
	#(copper/aluminium etc., in #magnetization:eddy_conductors) blocks is dragged
	#to a stop as if by induced eddy currents — it floats/slides slowly instead
	#of zipping past. 0 disables; 1.0 = default. Higher = stronger brake.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	lenzBrakingStrength = 1.0
	#Scale factor applied when converting impulse units to vanilla entity
	#delta-movement (velocity per tick). Default 1/20 = 0.05.
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	entityVelocityScale = 0.05
	#Cosine of the half-angle of conical emitters (repulsor coil). Default
	#cos(45deg) = 0.7071. Larger value = narrower cone.
	# Default: 0.7071
	# Range: 0.0 ~ 0.999
	conicalHalfAngleCos = 0.7071
	#Per-ship-per-tick acceleration cap (m/s², Sable's SI units), summed
	#across every emitter touching the ship that tick. Prevents a STRONG
	#anchor — or three of them — from launching a 1-block ship across the
	#world. 50 m/s² ~= 5 g, well above vanilla gravity's ~9.8 m/s². Set to
	#0 to disable the cap entirely.
	# Default: 50.0
	# Range: 0.0 ~ 1000.0
	maxAccelPerTick = 50.0
	#Per-tick linear-velocity damping applied to a ship while it is being
	#pulled by any magnetic emitter. 0.02 = the ship loses 2% of its current
	#speed every tick a magnet is acting on it, so constant-force pulls
	#settle to a terminal velocity instead of accelerating without bound.
	#Set to 0 to disable drag entirely (1.0.0 behaviour).
	# Default: 0.02
	# Range: 0.0 ~ 1.0
	shipLinearDrag = 0.02
	#Per-tick angular-velocity damping applied to a ship while it is being
	#pulled by any magnetic emitter. Counterpart to shipLinearDrag — without
	#this, the torque generated by off-center sample forces (see
	#shipSampleSteps) could keep a ship spinning indefinitely under sustained
	#pull. 0.05 = the ship loses 5% of its current spin every tick a magnet is
	#acting on it. Set to 0 to disable angular drag entirely.
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	shipAngularDrag = 0.05
	#How many sample points to take along each axis of a ship's bounding
	#box when integrating a magnetic field over it. 1 = single closest-point
	#sample (1.0.0 behaviour). 3 = a 3×3×3 grid, so larger ships feel
	#varying force across their volume — naturally producing torque from
	#non-uniform fields. Higher = smoother but quadratically more work per
	#emitter per ship.
	# Default: 3
	# Range: 1 ~ 7
	shipSampleSteps = 3
	#Multiplier on external magnetic force a ship feels with NO ferromagnetic
	#blocks on board. 1.0 = forces apply at full strength regardless of ship
	#composition (1.0.0 behaviour). Lower values mean a pure-stone ship is
	#less responsive to magnets, while a ferrous-rich ship can scale up to
	#shipMaxSusceptibility.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	shipBaselineSusceptibility = 1.0
	#Susceptibility added per ferromagnetic block (#magnetization:ferromagnetic_blocks)
	#aboard a ship. 0.05 = 20 iron blocks doubles the ship's responsiveness over
	#baseline. Stacks with shipPerMagnetSusceptibility.
	# Default: 0.05
	# Range: 0.0 ~ 5.0
	shipPerFerrousSusceptibility = 0.05
	#Susceptibility added per magnet emitter block (#magnetization:magnetic_emitter)
	#aboard a ship. Magnets count as ferrous-plus — their pole does NOT change
	#the ship's polarity, but their presence raises the ship's responsiveness
	#above what an equivalent count of plain ferrous blocks would.
	# Default: 0.15
	# Range: 0.0 ~ 5.0
	shipPerMagnetSusceptibility = 0.15
	#Upper cap on a ship's susceptibility multiplier. Prevents a 500-block
	#ferromagnetic airship from accelerating at 25× the rate of a small test
	#cube. Set high (e.g. 100) to effectively disable.
	# Default: 20.0
	# Range: 1.0 ~ 100.0
	shipMaxSusceptibility = 20.0
	#How often (ticks) a ship's magnetic state is rescanned. The scan walks
	#the contraption's loaded chunks to count ferromagnetic blocks, magnet
	#emitters, and polarity inverters. 20 = 1 s. Lower = more responsive to
	#block-level changes (e.g. an inverter destroyed by another mod) but more
	#CPU. Ships not currently inside any active field never get scanned
	#regardless of this interval. Bumped from the 1.0.1 default of 100 to
	#20 so polarity flips track block edits within a second.
	# Default: 20
	# Range: 1 ~ 6000
	shipScanIntervalTicks = 20
	#When an emitter is mounted on a contraption, exclude the ENTIRE assembly
	#it belongs to from that emitter's magnetic force — not just the single
	#sub-level the emitter physically sits on. In Create: Aeronautics an
	#aircraft built with bearings, springs or hinges is several Sable
	#sub-levels joined by physics constraints; with this off (1.1.x and
	#earlier behaviour) a magnet on the body would yank its own bearing-mounted
	#subgroups around, which both looks wrong (the craft pulls on itself) and
	#can spike or freeze the physics solver as the magnetic pull fights the
	#constraint that holds the parts together. Leave on unless you specifically
	#want emitters to act on connected subgroups of their own craft.
	excludeConnectedSubLevels = true
	#Default reaction of a diamagnetic craft (a Sable ship built with
	#Diamagnetic Blocks) to a magnetic field. true = repelled by BOTH poles
	#(real diamagnetism — the ship is pushed away from any emitter regardless
	#of polarity); false = ATTRACTED to both poles. A Polarity Inverter on the
	#ship flips whichever default you pick (repel <-> attract).
	diamagneticDefaultRepel = true

#Tick-rate gatings for the per-tick magnetic-reaction handlers. These trade
#responsiveness for CPU: higher = the effect re-evaluates less often (cheaper,
#slightly laggier reactions); lower = snappier but more work. Defaults match the
#values that were previously hard-coded, so leaving them alone changes nothing.
[performance]
	#How often (ticks) an idle/cold pyrrhotite rescans its surroundings for heat
	#sources + catalysts (a 15x15x15 block scan). 20 = 1 s. Higher = a newly-lit
	#burner takes longer to spin the pyrrhotite up.
	# Default: 20
	# Range: 1 ~ 6000
	pyrrhotiteScanTicks = 20
	#How often (ticks) an ALREADY-HOT pyrrhotite re-checks its heat. Longer than
	#pyrrhotiteScanTicks so a running pyrrhotite coasts on residual heat and stays
	#warm for a beat after its source is removed (and costs less while active).
	# Default: 60
	# Range: 1 ~ 6000
	pyrrhotiteResidualScanTicks = 60
	#How often (ticks) magnetized armor sweeps for nearby items. 1 = every tick
	#(1.x behaviour). The per-pull impulse is scaled by this interval, so raising
	#it stays visually identical while doing fewer item scans.
	# Default: 2
	# Range: 1 ~ 100
	armorVacuumTicks = 2
	#How often (ticks) MR fluid / hardened MR fluid re-checks whether it's in a
	#field (harden / revert). 5 = 4x/s.
	# Default: 5
	# Range: 1 ~ 1200
	mrFluidHardenTicks = 5
	#How often (ticks) magnetized ferrofluid pools re-emit their weak field.
	# Default: 3
	# Range: 1 ~ 1200
	magnetizedFerrofluidTicks = 3
	#How often (ticks) powered gallium in a field pushes entities (Lorentz current).
	#Lower = smoother flow, more entity scans.
	# Default: 2
	# Range: 1 ~ 1200
	galliumCurrentTicks = 2
	#How often (ticks) MAGNETIZED ferrofluid creeps one cell toward/away from a field.
	# Default: 4
	# Range: 1 ~ 1200
	ferrofluidMagTicks = 4
	#How often (ticks) PLAIN ferrofluid creeps (and the recede pass runs). Slower
	#than magnetized by default.
	# Default: 8
	# Range: 1 ~ 1200
	ferrofluidPlainTicks = 8
	#How often (ticks) worn MR armor refreshes its in-field hardened state.
	# Default: 5
	# Range: 1 ~ 1200
	mrArmorRefreshTicks = 5
	#How often (ticks) an MR fluid golem re-checks whether it's in a field.
	# Default: 5
	# Range: 1 ~ 1200
	golemFieldCheckTicks = 5
	#How often (ticks) the Anomaly biome rolls its random chaos impulses.
	# Default: 4
	# Range: 1 ~ 1200
	anomalyChaosTicks = 4
	#How often (ticks) a moving magnetic ship scans for eddy-current (Lenz) brakes.
	# Default: 2
	# Range: 1 ~ 1200
	lenzBrakingTicks = 2
	#How often (ticks) registered meteorite cores re-apply their field.
	# Default: 4
	# Range: 1 ~ 1200
	meteoriteFieldTicks = 4
	#How often (ticks) the Petrified Forest rolls its lightning-strike chance per player.
	#100 = every 5 s. (The strike CHANCE/radius are under the lightning category.)
	# Default: 100
	# Range: 1 ~ 24000
	petrifiedStormTicks = 100
	#How often (ticks) temporary lightning-seeded fields re-apply their pull.
	# Default: 4
	# Range: 1 ~ 1200
	temporaryLirmApplyTicks = 4
	#How often (ticks) a planted meteorite sapling checks its growth progress.
	# Default: 200
	# Range: 1 ~ 24000
	meteoriteSaplingCheckTicks = 200

