#Misc mechanic tuning: the gallium Lorentz current, gallium freeze/melt timing,
#and eddy-current (Lenz) ship braking. Defaults match the previous values.
[mechanics]
	#Peak per-application velocity nudge the gallium Lorentz current gives entities,
	#at full redstone signal.
	# Default: 0.09
	# Range: 0.0 ~ 5.0
	galliumCurrentSpeed = 0.09
	#Ticks for liquid gallium to freeze once a cooling source is adjacent.
	# Default: 40
	# Range: 1 ~ 24000
	galliumFreezeDelayTicks = 40
	#Ticks for solid gallium to melt back once no cooling source is adjacent.
	# Default: 120
	# Range: 1 ~ 24000
	galliumMeltDelayTicks = 120
	#Fraction of a braking ship's velocity removed per application (before scaling).
	# Default: 0.13
	# Range: 0.0 ~ 1.0
	lenzBaseDrag = 0.13
	#Hard cap on per-application velocity loss, so braking never reverses a ship.
	# Default: 0.55
	# Range: 0.0 ~ 1.0
	lenzMaxDrag = 0.55
